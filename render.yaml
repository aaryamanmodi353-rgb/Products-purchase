services:
  - type: web
    name: ecommerce-backend
    env: docker
    dockerContext: ecommerce-backend
    dockerfilePath: ecommerce-backend/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: COMMERCETOOLS_PROJECT_KEY
        sync: false
      - key: COMMERCETOOLS_CLIENT_ID
        sync: false
      - key: COMMERCETOOLS_CLIENT_SECRET
        sync: false
      - key: COMMERCETOOLS_API_URL
        sync: false
      - key: COMMERCETOOLS_AUTH_URL
        sync: false
      - key: COMMERCETOOLS_PRODUCT_TYPE_ID
        sync: false
      - key: COMMERCETOOLS_LOCALE
        value: en
      - key: COMMERCETOOLS_CURRENCY
        value: USD
      - key: CORS_ALLOWED_ORIGINS
        value: https://ecommerce-frontend-pi-lemon.vercel.app
    region: ohio
    plan: free
